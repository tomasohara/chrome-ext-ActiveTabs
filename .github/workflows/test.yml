name: UI Tests

on:
  push:
    branches: [ master, development, '*' ]
  pull_request:
    branches: [ master, development ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        # eslint's engines field requires ^20.19.0 || ^22.13.0 || >=24.
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run Puppeteer regression tests
      run: npm test

    - name: Upload screenshot on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-screenshot
        path: test_screenshot.png
        if-no-files-found: ignore
